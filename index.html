<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kingdom Lab · Cotizador</title>
<meta name="description" content="Arma tu plan de fotografía, audiovisual y diseño visual con Kingdom Lab, pieza por pieza."/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700;800&amp;family=Urbanist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          black: "#000000",
          charcoal: "#161616",
          paper: "#FFFFFF",
          "paper-dim": "#F1F1F2",
          ink: "#111113",
          "ink-soft": "#5B5B60",
          "ink-faint": "#8D8D92",
          line: "#E6E6E8",
          "line-strong": "#B8B8BB"
        },
        fontFamily: { display: ["Bodoni Moda", "Georgia", "serif"] }
      }
    }
  };
</script>
<style>
  body { font-family: "Urbanist", system-ui, sans-serif; }
  .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; font-size: 20px; line-height: 1; vertical-align: middle; }
  .stepper-btn:active { transform: scale(0.94); }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 999px; }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
  }
  .kl-wordmark { position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .kl-kingdom { font-family: "Bodoni Moda", "Playfair Display", serif; font-weight: 700; font-size: 22px; letter-spacing: 0.035em; color: #fff; }
  .kl-star { position: absolute; top: -4px; right: -15px; }
  .kl-lab { font-family: "Urbanist", sans-serif; font-weight: 600; font-size: 8.5px; letter-spacing: 0.42em; color: #fff; margin-top: 4px; padding-left: 0.42em; }
</style>
</head>
<body class="bg-black text-ink min-h-screen">

<header class="no-print bg-black text-white sticky top-0 z-30 border-b border-white/10">
  <div class="max-w-6xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="kl-wordmark">
        <span class="kl-kingdom">KINGDOM</span>
        <svg class="kl-star" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 13.9 9.4 21.5 12 13.9 14.6 12 22.5 10.1 14.6 2.5 12 10.1 9.4Z" fill="#fff"/></svg>
        <span class="kl-lab">LAB</span>
      </div>
      <p class="text-[11px] text-white/45 pl-3 ml-1 border-l border-white/15 hidden sm:block leading-tight">Fotografía · Audiovisual<br/>Diseño visual</p>
    </div>
    <div class="flex items-center gap-2 md:gap-3">
      <a href="anexo.html" class="text-xs md:text-sm text-white/70 hover:text-white transition-colors px-2.5 py-1.5 rounded-lg hover:bg-white/10">
        Servicios adicionales
      </a>
      <button id="btn-reset" type="button" class="flex items-center gap-1.5 text-xs md:text-sm text-white/70 hover:text-white transition-colors px-2.5 py-1.5 rounded-lg hover:bg-white/10">
        <span class="material-symbols-outlined !text-[16px]">restart_alt</span>
        <span class="hidden sm:inline">Reiniciar</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 md:px-8 py-8 md:py-12 pb-32">

  <div class="mb-8 md:mb-10">
    <h1 class="font-display font-extrabold text-3xl md:text-[42px] leading-[1.1] tracking-tight text-white">Tu plan, pieza por pieza.</h1>
    <p class="text-white/55 text-sm md:text-base mt-2.5 max-w-xl">Las recomendaciones son un punto de partida: puedes adaptar cada cantidad a tu presupuesto.</p>
  </div>

  <nav id="step-nav" class="no-print flex items-center gap-2 md:gap-3 mb-7 overflow-x-auto pb-1"></nav>

  <div id="step-root" class="bg-paper rounded-[28px] shadow-[0_30px_60px_-15px_rgba(0,0,0,0.55)] min-h-[420px]"></div>

</main>

<div id="footer-bar" class="no-print fixed bottom-0 inset-x-0 bg-black/95 backdrop-blur border-t border-white/10 z-30">
  <div class="max-w-6xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between gap-4">
    <div id="footer-total" class="text-sm text-white/55"></div>
    <div class="flex items-center gap-3">
      <button id="btn-back" type="button" class="px-5 py-2.5 rounded-xl border border-white/20 text-sm font-semibold text-white/80 hover:bg-white/10 hover:text-white transition-colors">Atrás</button>
      <button id="btn-next" type="button" class="px-6 py-2.5 rounded-xl bg-white text-black text-sm font-bold hover:bg-white/85 transition-colors flex items-center gap-2">
        <span id="btn-next-label">Continuar</span>
        <span class="material-symbols-outlined !text-[18px]">arrow_forward</span>
      </button>
    </div>
  </div>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
